name: Build FlowGraph core packages

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test FlowGraph (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked test environment with CGNS support
        if: matrix.os == 'ubuntu-latest'
        run: uv sync --locked --extra dev --extra io --extra ci --extra imagej

      - name: Install locked test environment without CGNS support
        if: matrix.os != 'ubuntu-latest'
        run: uv sync --locked --extra dev --extra io --extra cosapp --extra imagej

      - name: Run Ruff
        run: uv run ruff format --check . && uv run ruff check .

      - name: Snapshot installed project dependencies
        run: uv run --no-sync python packaging/audit_requirements.py --output .validation-dist/audit-requirements.txt

      - name: Audit installed project dependencies
        run: uvx --from pip-audit pip-audit --requirement .validation-dist/audit-requirements.txt --no-deps --disable-pip --strict

      - name: Run tests with CGNS coverage
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest

      - name: Run tests without CGNS-dependent tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest --ignore=tests/test_plaid_bridge.py

  build:
    name: Build packages on hosted runner
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show build environment
        run: |
          cat /etc/os-release
          uname -a
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked build environment
        run: uv sync --locked --extra dev

      - name: Build wheel and source distribution
        run: uv build --no-sources --out-dir dist-wheels

      - name: Validate built artifact versions
        run: python packaging/check_release.py --artifacts dist-wheels

      - name: Upload FlowGraph Core packages
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: flowgraph-core-packages
          path: dist-wheels/*
          compression-level: 0
          if-no-files-found: error
          # Download window only; published-release evidence is archived separately.
          retention-days: 30

  test-artifacts:
    name: Test ${{ matrix.artifact }} (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        artifact: [wheel, sdist]
    steps:
      - name: Check out smoke-test scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"

      - name: Download the packages built in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowgraph-core-packages
          path: downloaded-packages

      - name: Install and exercise the distribution outside the checkout
        run: python packaging/test_artifact.py --artifacts downloaded-packages --kind ${{ matrix.artifact }}

  core-ci:
    name: Core CI
    if: always()
    needs: [test, build, test-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful source, build, and artifact checks
        shell: python
        env:
          SOURCE_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ARTIFACT_RESULT: ${{ needs.test-artifacts.result }}
        run: |
          import os
          import sys

          for variable in ("SOURCE_RESULT", "BUILD_RESULT", "ARTIFACT_RESULT"):
              result = os.environ.get(variable, "")
              if result != "success":
                  print(f"Core CI requires every prerequisite to succeed; observed: {result}")
                  sys.exit(1)

  validate-release:
    name: Validate tag against downloaded release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.13"

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowgraph-core-packages
          path: release-assets

      - name: Validate release tag and artifact metadata
        run: python packaging/check_release.py --artifacts release-assets --tag "$GITHUB_REF_NAME"

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowgraph-core-packages
          path: release-assets

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag

  publish-pypi:
    name: Publish packages to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowgraph
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowgraph-core-packages
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1