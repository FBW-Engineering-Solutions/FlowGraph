name: Build FlowGraph core packages

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test FlowGraph (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked test environment with CGNS support
        if: matrix.os == 'ubuntu-latest'
        run: uv sync --locked --extra dev --extra ci

      - name: Install locked test environment without CGNS support
        if: matrix.os != 'ubuntu-latest'
        run: uv sync --locked --extra dev --extra cosapp

      - name: Run Ruff
        run: uv run ruff format --check . && uv run ruff check .

      - name: Audit dependencies
        run: uvx --from pip-audit pip-audit --strict

      - name: Run tests with CGNS coverage
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest

      - name: Run tests without CGNS-dependent tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest --ignore=tests/test_plaid_bridge.py

  build:
    name: Build packages on hosted runner
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show build environment
        run: |
          cat /etc/os-release
          uname -a
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked build environment
        run: uv sync --locked --extra dev

      - name: Build flowgraph wheel
        run: uv build --out-dir dist-wheels

      - name: Smoke-test built artifacts
        shell: bash
        run: |
          python -m venv .artifact-venv
          . .artifact-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist-wheels/flowgraph-*.whl
          flowgraph --help
          python -c 'import flowgraph; print(flowgraph.__version__)'

      - name: Upload FlowGraph Core packages
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: flowgraph-core-packages
          path: dist-wheels/*
          compression-level: 0
          if-no-files-found: error
          # Keep CI artifacts for one day.
          retention-days: 1

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag

  publish-pypi:
    name: Publish packages to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowgraph
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flowgraph-core-packages
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1