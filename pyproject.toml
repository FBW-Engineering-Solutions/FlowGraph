[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgraph"
version = "0.1.5"
description = "Headless typed workflow engine and execution runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Bordeu" }]
maintainers = [{ name = "Felipe Bordeu" }]
keywords = ["workflow", "graph", "mesh", "scientific-computing", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "vtk>=9.2",
  "muscat>=2.5.2",
  "meshio>=5.3",
  "meshlane>=5.5.0",
  "scipy>=1.10",
  "pandas",
  "h5py",
  "pillow>=10.0",
  "numpy>=1.24",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
imagej = [
  "pyimagej",
  "scyjava",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build",
]
ml = [
  "pyplaid",
]
cosapp = [
  "cosapp>=1.6.1",
]
ci = [
  "cosapp>=1.6.1",
  "pycgns",
]

[project.urls]
Homepage = "https://github.com/FBW-Engineering-Solutions/FlowGraph"
Repository = "https://github.com/FBW-Engineering-Solutions/FlowGraph.git"
Issues = "https://github.com/FBW-Engineering-Solutions/FlowGraph/issues"

[project.scripts]
flowgraph = "flowgraph.core_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"flowgraph" = [
  "testdata/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

